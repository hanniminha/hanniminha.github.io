<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Feliz Aniversário 💗</title>

<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff9ecf, #ffc2e2);
    color: white;
    overflow: hidden;
}

h1 {
    margin-top: 80px;
    font-size: 38px;
}

p {
    font-size: 20px;
    max-width: 300px;
    margin: 20px auto;
}

button {
    margin-top: 30px;
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #ff4da6;
    font-size: 18px;
}

.heart {
    position: absolute;
    color: #ff4da6;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10%); opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
}
</style>
</head>

<body>

<h1>Feliz Aniversário, Meu Amor 💗</h1>

<p>
Você é o meu lugar seguro, o meu sorriso favorito e a melhor parte de todos os meus dias.
Eu sou muito grata por ter você na minha vida.
</p>

<button onclick="mensagem()">Clique aqui 💞</button>

<script>
function mensagem() {
    alert("Eu te amo mais do que qualquer palavra consegue explicar 💗✨");
}

function criarCoracoes() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    heart.style.animationDuration = Math.random() * 3 + 3 + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(criarCoracoes, 400);
</script>

</body>
</html>
