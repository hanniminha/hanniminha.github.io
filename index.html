<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pra Você 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#f8c8dc, #f4a7c0);
  text-align: center;
  padding-top: 60px;
}

h1 {
  color: #ff2e7e;
  font-size: 28px;
}

button {
  background: #ff2e7e;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 20px;
}

button:hover {
  background: #e60063;
}

#player {
  display: none;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>Tem uma coisa pra você 💌</h1>

<button onclick="mostrarMusica()">🎵 Ouvir nossa música</button>

<div id="player">
  <iframe width="300" height="170"
    src="https://www.youtube.com/embed/46w_wj1hXac?autoplay=1"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen
    style="border-radius:15px;">
  </iframe>
</div>

<script>
function mostrarMusica() {
  document.getElementById("player").style.display = "block";
}
</script>

</body>
</html>
